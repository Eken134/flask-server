apiVersion: v1
kind: Namespace
metadata:
  name: trading-signals
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-gateway
  namespace: trading-signals
spec:
  replicas: 1
  selector:
    matchLabels: { app: flask-gateway }
  template:
    metadata:
      labels: { app: flask-gateway }
    spec:
      containers:
        - name: flask-gateway
          image: ghcr.io/REPLACE_ME_OWNER/REPLACE_ME_REPO:latest
          imagePullPolicy: Always
          env:
            - { name: REDIS_HOST, value: "redis" }     # byt till din Redis service/host
            - { name: REDIS_PORT, value: "6379" }
            - { name: LATEST_HASH_KEY, value: "latest:ohlc" }
            - { name: USE_STREAM, value: "0" }         # "1" om du vill XADD:a stream
            - { name: STREAM_NAME, value: "ticks.v1" }
            - { name: STREAM_MAXLEN, value: "100000" }
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: flask-gateway
  namespace: trading-signals
spec:
  selector: { app: flask-gateway }
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
# Valfritt: Ingress (NGINX) för WebSocket/Socket.IO
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-gateway
  namespace: trading-signals
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "balanced"
spec:
  ingressClassName: nginx
  rules:
    - host: analysis.example.com            # ← ändra till din domän
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-gateway
                port: { number: 80 }
  # Valfritt TLS:
  # tls:
  #   - hosts: [analysis.example.com]
  #     secretName: flask-gateway-tls
